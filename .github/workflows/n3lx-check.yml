name: N3LX checks
# Default release validation runs locally; see docs/LOCAL_RELEASE_VALIDATION.md.
# Hosted execution is optional and requires an explicit manual dispatch.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg build-essential
      - run: uv sync --frozen --all-extras
      - run: uv run pytest tests/test_directml_local.py tests/test_studio_local.py tests/test_complete_multitrack_local.py tests/test_processing_progress.py tests/test_ui_store.py
      - run: node tests/js/studio-lanes.test.mjs
      - run: node tests/js/multitrack-playback.test.mjs
      - run: node tests/js/wav-header.test.mjs
      - run: node tests/js/audio-routing.test.mjs
      - run: node --check desktop-app/main.cjs

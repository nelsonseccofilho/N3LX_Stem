name: N3LX checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  focused-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg build-essential
      - run: uv sync --frozen --all-extras
      - run: uv run pytest tests/test_directml_local.py tests/test_studio_local.py tests/test_complete_multitrack_local.py
      - run: node tests/js/studio-lanes.test.mjs
